[project]
name = "reel-match"
version = "1.0.0"
description = "Chat assistant that helps two people pick a movie date: a showing near both of them that fits both their tastes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openai-agents>=0.5.1",
    "pydantic>=2.12.3,<3",
    "fastapi>=0.121.2",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
]

[project.urls]
Repository = "https://github.com/Shuo0503/Reel_Match"

[dependency-groups]
dev = [
    "ruff>=0.9.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"app/agent.py" = ["E501"]  # long prompt strings
